name: Check pull request

# Runs on every pull request: validates data/*.json and test-builds the site (nothing is published).
on:
  pull_request:
    paths: ['data/**', 'scripts/**', 'web/**', 'requirements.txt']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build.py --check
      - run: python scripts/build.py
      - name: Summary
        run: |
          python -c "import json; s=json.load(open('site/api/status.json')); print(s['counts'])" >> "$GITHUB_STEP_SUMMARY"
